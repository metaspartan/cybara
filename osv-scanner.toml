[[IgnoredVulns]]
id = "GHSA-vfj7-8cjw-p6xm"
ignoreUntil = 2026-12-31
reason = "braces 3.0.3 is the latest published release and the advisory range covers every version, so there is nothing to upgrade to. parse() bounds only character count (MAX_LENGTH = 10000) and not nesting depth, while the compile.js and expand.js AST walkers recurse once per nesting level; the advisory measures a crash at depth >= ~3500 under that cap. patches/braces@3.0.3.patch adds a MAX_DEPTH = 100 brace-nesting guard in parse(), which bounds every downstream walker at the source. Verified: a 4900-level pattern (9801 chars, under the character cap) is rejected with a SyntaxError instead of overflowing the stack, while legitimate patterns including {a,b}, a/{b,c}/d, src/**/*.{ts,tsx} and {a,{b,{c,d}}} still compile to identical output. security-audit verifies patch registration and installed source before applying this version-only exception. Remove once upstream ships a fix."
