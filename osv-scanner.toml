ignoreUntil = 2026-12-31
reason = "rkyv 0.7 arrives only as an optional feature of rust_decimal via tauri-plugin-log/byte-unit; rust_decimal 1.42.1 is the latest release and still pins rkyv ^0.7 with no 0.8 upgrade path. The rkyv feature is not enabled in this build (rkyv is a lockfile-only entry, absent from the resolved graph), so no untrusted rkyv archives are validated."

# image-size has no patched release: the advisory range is <= 2.0.2 and 2.0.2 is
# the latest published version, so there is nothing to upgrade to and the package
# is pulled in transitively by metro (expo and react-native), which cannot be
# dropped. The vulnerable loops are instead fixed in-tree with a bun patch
# (apps/mobile/patches/image-size@1.2.1.patch) that guards the zero-length ICNS
# entry and zero-size JXL box. These entries suppress the version-range match
# only; the code itself is no longer vulnerable. Remove once upstream ships a fix.
[[IgnoredVulns]]
id = "GHSA-5p2g-fcmc-qvqq"
ignoreUntil = 2026-12-31
reason = "image-size JXL/HEIF zero-size box infinite loop is patched in-tree via apps/mobile/patches/image-size@1.2.1.patch; upstream has no fixed release (advisory range <= 2.0.2, latest published 2.0.2). Verified against the advisory proof of concept: unpatched 1.2.1 exhausts the heap, the patched build returns."

