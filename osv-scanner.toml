[[IgnoredVulns]]
id = "RUSTSEC-2026-0370"
ignoreUntil = 2026-12-31
reason = "Unmaintained notice, not a vulnerability: zvariant was folded into zbus 6. It is pulled in by zbus 5 through notify-rust and tauri-plugin-single-instance on Linux, and every published release of both still requires zbus ^5, so there is no upgrade path yet. Remove once they move to zbus 6."

