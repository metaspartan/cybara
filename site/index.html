            ]

          },
          {
            "@type": "BreadcrumbList",
            "itemListElement": [
              {
                "@type": "ListItem",

          {
            "@type": "FAQPage",
            "mainEntity": [
              {
                "@type": "Question",
                "name": "What is Cybara?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Cybara is a self-hosted AI agent platform. It pairs a Bun-based agent runtime with a web UI, desktop and mobile apps, a CLI, a broad tool layer, messaging-channel adapters, MCP support, and encrypted wallet controls, so agents can code, automate browsers, run messaging workflows, and execute on-chain operations under operator control."
                }
              },
              {
                "@type": "Question",
                "name": "Is Cybara free and open source?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Yes. Cybara is free and open source under the MIT license, created by Carsen Klock, and runs entirely on infrastructure you control. Use it commercially, fork it, and self-host it with no required account, telemetry, or cloud service."
                }
              },
              {
                "@type": "Question",
                "name": "Which platforms does Cybara run on?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Cybara ships desktop apps for macOS, Windows, and Linux, a native SwiftUI macOS app, mobile apps for iOS and Android, and command-line binaries for macOS, Windows, and Linux — plus a VS Code extension and an ACP server for editors — all built from the same Bun runtime and published on GitHub Releases."
                }
              },
              {
                "@type": "Question",
                "name": "Which messaging channels are supported?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Cybara includes adapters for Telegram, Discord, Slack, WhatsApp, Signal, iMessage, Matrix, Mattermost, Microsoft Teams, Feishu/Lark, DingTalk, WeCom, Zulip, LINE, Google Chat, IRC, ntfy, Twitch, Nextcloud, Synology, Zalo, Home Assistant, SMS, Email, Web, and Webhook, each gated by pairing, allowlists, and per-channel access policy."
                }
              },
              {
                "@type": "Question",
                "name": "How do I migrate from another agent to Cybara?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Run 'cybara migrate --from openclaw' or 'cybara migrate --from hermes'. Cybara detects local installs, previews the import as a dry run, brings over skills and memory, resolves conflicts by skip, overwrite, or rename, and imports API keys only if you opt in."
                }
              },
              {
                "@type": "Question",
                "name": "Do the apps update automatically?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Yes. Desktop apps use a signed updater channel backed by GitHub Releases and install updates in place, and the CLI verifies a published SHA256 checksum on every 'cybara update'."
                }
              },
              {
                "@type": "Question",
                "name": "How does Cybara keep operators in control?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Sensitive tool calls can require interactive approval with per-session or persistent allowlists, the filesystem supports checkpoint and rollback, wallet operations enforce policy caps and allowlists, and the gateway uses a localhost auth policy with rotatable API keys."
                }
              },
              {
                "@type": "Question",
                "name": "Which model providers can I use with Cybara?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Cybara connects to 50+ providers including OpenAI, Anthropic, Google Gemini, xAI, Meta, DeepSeek, Qwen, Moonshot/Kimi, Z.ai/GLM, MiniMax, Groq, OpenRouter, Azure OpenAI, AWS Bedrock, Vertex AI, and local runtimes like Ollama, vLLM, LM Studio, and llama.cpp. You bring your own keys; Cybara pools multiple keys per provider, rotates on rate limits, routes by weight or cost, and enforces spend caps."
                }
              },
              {
                "@type": "Question",
                "name": "How does Cybara handle my API keys and data?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Everything stays on infrastructure you control. Model keys, wallet keys, memory, and conversations live locally, the wallet is encrypted at rest, and there is no required account, telemetry, or cloud relay. Keys are never printed to logs and never leave your machine unless a tool you approve sends them."
                }
              },
              {
                "@type": "Question",
                "name": "Can I drive Cybara from my code editor?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Yes. Run 'cybara acp' to expose the agent over the Agent Client Protocol (ACP) and connect Zed or any ACP-compatible editor to code with your own self-hosted runtime. The ACP server can be toggled on or off in settings."
                }
              },
              {
                "@type": "Question",
                "name": "What are Cybara skills and where do they come from?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Skills are reusable SKILL.md procedures agents follow for recurring work. Browse and install them from the ClawHub, Skills.sh, and GitHub registries, author your own, or let agents codify a verified procedure automatically so the loader reuses it in future sessions."
                }
              },
              {
                "@type": "Question",
                "name": "Does Cybara support MCP servers?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "In both directions. Install Model Context Protocol servers as agent tools from the official MCP registry, Smithery, or npm, or expose Cybara's own tools to Claude Desktop and other MCP clients."
                }
              },
              {
                "@type": "Question",
                "name": "Can agents use a real web browser?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Yes. Each session gets an embedded browser the agent drives — opening pages, clicking, scrolling, extracting data, and taking screenshots — and you watch it work live in the chat panel. It works cross-platform, including on Windows. Beyond the browser, a computer-use tool can drive the desktop in the background without taking over your cursor."
                }
              },
              {
                "@type": "Question",
                "name": "Can I talk to my agents with voice?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Yes. Cybara supports hands-free voice conversations with local Kokoro TTS, OS speech, or cloud voices, plus speech-to-text transcription — including a realtime full-duplex mode where you and the agent can speak naturally."
                }
              },
              {
                "@type": "Question",
                "name": "Can agents run on a schedule?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Yes. A built-in cron scheduler runs agents and tools on a timetable you set — recurring reports, monitors, and maintenance jobs — with results delivered to the UI or any connected messaging channel."
                }
              },
              {
                "@type": "Question",
                "name": "What does Cybara cost?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Cybara itself is free and MIT-licensed. You only pay for model provider usage on your own accounts — Cybara adds no markup, subscription, or per-seat fee, and there is no hosted tier to buy."
                }
              }
            ]
          }
