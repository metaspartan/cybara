name: Main Version And Tag

on:
  push:
    branches:
      - main

permissions:
  contents: write
  actions: write

# Pin Bun for reproducible version resolution + skip puppeteer.
env:
  BUN_VERSION: '1.3.14'
  PUPPETEER_SKIP_DOWNLOAD: 'true'

jobs:
  sync_version_and_tag:
    if: github.actor != 'github-actions[bot]'
    runs-on: get32

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --ignore-scripts && bun run scripts/postinstall.ts

      - name: Resolve release version
        id: version
        env:
          CYBARA_RELEASE_COMMIT_OFFSET: "1"
        run: echo "value=$(bun run version:print)" >> "$GITHUB_OUTPUT"

      - name: Sync version files
        env:
          CYBARA_RELEASE_COMMIT_OFFSET: "1"
        run: bun run version:sync

      - name: Commit synced version
        run: |
          if git diff --quiet -- package.json ui/package.json src-tauri/Cargo.toml src-tauri/tauri.conf.json; then
            echo "No version changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json ui/package.json src-tauri/Cargo.toml src-tauri/tauri.conf.json
          git commit -m "chore: sync release version to v${{ steps.version.outputs.value }} [skip ci]"
          git push

      - name: Refresh refs after sync
        run: git fetch --tags origin main

      - name: Create and push release tag
        id: tag
        run: |
          TAG="v${{ steps.version.outputs.value }}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists."
            echo "created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git tag "$TAG"
          git push origin "$TAG"
          echo "created=true" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Trigger Release workflow
        if: steps.tag.outputs.created == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run release.yml --ref ${{ steps.tag.outputs.tag }} \
            -f skip_tests=false
          echo "Triggered release.yml for ${{ steps.tag.outputs.tag }}"
