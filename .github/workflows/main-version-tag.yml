name: Main Version And Tag

on:
  push:
    branches:
      - main

permissions:
  contents: write
  actions: write

# Pin Bun for reproducible version resolution + skip puppeteer.
env:
  BUN_VERSION: "1.4.0"
  PUPPETEER_SKIP_DOWNLOAD: "true"

jobs:
  sync_version_and_tag:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bash scripts/ci-install.sh --ignore-scripts && bun run scripts/postinstall.ts

      - name: Resolve release version
        id: version
        env:
          CYBARA_RELEASE_COMMIT_OFFSET: "1"
        run: echo "value=$(bun run version:print)" >> "$GITHUB_OUTPUT"

      - name: Sync version files
        env:
          CYBARA_RELEASE_COMMIT_OFFSET: "1"
        run: bun run version:sync

      - name: Commit synced version
        run: |
          if git diff --quiet -- package.json ui/package.json src-tauri/Cargo.toml src-tauri/tauri.conf.json apps/mobile/app.json nix/release.nix; then
            echo "No version changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json ui/package.json src-tauri/Cargo.toml src-tauri/tauri.conf.json apps/mobile/app.json nix/release.nix
          git commit -m "chore: sync release version to v${{ steps.version.outputs.value }} [skip ci]"
          git push

      - name: Refresh refs after sync
        run: git fetch --tags origin main

      - name: Create and push release tag
        id: tag
        run: |
          TAG="v${{ steps.version.outputs.value }}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists."
            echo "created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git tag "$TAG"
          git push origin "$TAG"
          echo "created=true" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Trigger Release workflow
        if: steps.tag.outputs.created == 'true'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'release.yml',
              ref: '${{ steps.tag.outputs.tag }}'
            });
            core.info('Triggered release.yml for ${{ steps.tag.outputs.tag }}');
