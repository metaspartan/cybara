name: Publish Packages

on:
  release:
    types: [released]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (no leading v), e.g. 1.0.1200"
        required: true

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - id: v
        run: |
          VER="${{ github.event.inputs.version }}"
          [ -z "$VER" ] && VER="${GITHUB_REF_NAME#v}"
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "Publishing version $VER"

  aur-cli:
    needs: resolve
    runs-on: ubuntu-latest
    env:
      HAS: ${{ secrets.AUR_SSH_PRIVATE_KEY != '' }}
    steps:
      - if: env.HAS == 'true'
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Set pkgver
        if: env.HAS == 'true'
        run: sed -i "s/^pkgver=.*/pkgver=${{ needs.resolve.outputs.version }}/" packaging/aur/cybara-bin/PKGBUILD
      - name: Publish to AUR
        if: env.HAS == 'true'
        uses: KSXGitHub/github-actions-deploy-aur@da03e160361ce01bf087e790b6ffd196d7dccff7 # v4.1.3
        with:
          pkgname: cybara-bin
          pkgbuild: packaging/aur/cybara-bin/PKGBUILD
          commit_username: cybara-bot
          commit_email: carsen@wombo.ai
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: "cybara-bin ${{ needs.resolve.outputs.version }}"
          updpkgsums: true

  aur-desktop:
    needs: resolve
    runs-on: ubuntu-latest
    env:
      HAS: ${{ secrets.AUR_SSH_PRIVATE_KEY != '' }}
    steps:
      - if: env.HAS == 'true'
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Set pkgver
        if: env.HAS == 'true'
        run: sed -i "s/^pkgver=.*/pkgver=${{ needs.resolve.outputs.version }}/" packaging/aur/cybara-desktop-bin/PKGBUILD
      - name: Publish to AUR
        if: env.HAS == 'true'
        uses: KSXGitHub/github-actions-deploy-aur@da03e160361ce01bf087e790b6ffd196d7dccff7 # v4.1.3
        with:
          pkgname: cybara-desktop-bin
          pkgbuild: packaging/aur/cybara-desktop-bin/PKGBUILD
          commit_username: cybara-bot
          commit_email: carsen@wombo.ai
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: "cybara-desktop-bin ${{ needs.resolve.outputs.version }}"
          updpkgsums: true

  snap:
    needs: resolve
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    env:
      HAS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS != '' }}
      CYBARA_VERSION: ${{ needs.resolve.outputs.version }}
    steps:
      - if: env.HAS == 'true'
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Build snap
        id: build
        if: env.HAS == 'true'
        uses: snapcore/action-build@3bdaa03e1ba6bf59a65f84a751d943d549a54e79 # v1.3.0
      - name: Publish snap
        if: env.HAS == 'true'
        uses: snapcore/action-publish@214b86e5ca036ead1668c79afb81e550e6c54d40 # v1.2.0
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        with:
          snap: ${{ steps.build.outputs.snap }}
          release: stable

  homebrew:
    needs: resolve
    runs-on: ubuntu-latest
    env:
      HAS: ${{ secrets.HOMEBREW_TAP_TOKEN != '' }}
      VER: ${{ needs.resolve.outputs.version }}
      REPO: metaspartan/cybara
      TAP: metaspartan/homebrew-cybara
    steps:
      - name: Checkout tap
        if: env.HAS == 'true'
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: metaspartan/homebrew-cybara
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap
      - name: Generate formula + cask
        if: env.HAS == 'true'
        run: |
          set -euo pipefail
          base="https://github.com/${REPO}/releases/download/v${VER}"
          sha() { curl -fsSL "$base/$1.sha256" | awk '{print $1}'; }
          dsha() { curl -fL "$base/$1" -o /tmp/a && sha256sum /tmp/a | awk '{print $1}'; }
          mac_arm="$(sha cybara-v${VER}-darwin-arm64-cli)"
          mac_x64="$(sha cybara-v${VER}-darwin-x64-cli)"
          lin_arm="$(sha cybara-v${VER}-linux-arm64-cli)"
          lin_x64="$(sha cybara-v${VER}-linux-x64-cli)"
          dmg_arm="$(dsha Cybara_${VER}_aarch64.dmg)"
          dmg_x64="$(dsha Cybara_${VER}_x64.dmg)"
          mkdir -p tap/Formula tap/Casks
          cat > tap/Formula/cybara.rb <<RUBY
          class Cybara < Formula
            desc "Self-hosted, open-source AI agent platform (CLI)"
            homepage "https://cybara.ai"
            version "${VER}"
            license "MIT"
            on_macos do
              on_arm { url "${base}/cybara-v${VER}-darwin-arm64-cli"; sha256 "${mac_arm}" }
              on_intel { url "${base}/cybara-v${VER}-darwin-x64-cli"; sha256 "${mac_x64}" }
            end
            on_linux do
              on_arm { url "${base}/cybara-v${VER}-linux-arm64-cli"; sha256 "${lin_arm}" }
              on_intel { url "${base}/cybara-v${VER}-linux-x64-cli"; sha256 "${lin_x64}" }
            end
            def install
              bin.install Dir["*"].first => "cybara"
            end
            test do
              assert_match "cybara", shell_output("#{bin}/cybara --help", 2)
            end
          end
          RUBY
          cat > tap/Casks/cybara.rb <<RUBY
          cask "cybara" do
            version "${VER}"
            on_arm { sha256 "${dmg_arm}"; url "${base}/Cybara_#{version}_aarch64.dmg" }
            on_intel { sha256 "${dmg_x64}"; url "${base}/Cybara_#{version}_x64.dmg" }
            name "Cybara"
            desc "Self-hosted, open-source AI agent platform"
            homepage "https://cybara.ai"
            app "Cybara.app"
          end
          RUBY
      - name: Commit + push tap
        if: env.HAS == 'true'
        run: |
          cd tap
          git config user.name "cybara-bot"
          git config user.email "carsen@wombo.ai"
          git add Formula/cybara.rb Casks/cybara.rb
          git commit -m "cybara ${VER}" || { echo "no changes"; exit 0; }
          git push

  docker:
    needs: resolve
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      VER: ${{ needs.resolve.outputs.version }}
      IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Lowercase image name
        id: img
        run: echo "name=$(echo "$IMAGE" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: packaging/docker
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ env.VER }}
            REPO=${{ github.repository }}
          tags: |
            ${{ steps.img.outputs.name }}:${{ env.VER }}
            ${{ steps.img.outputs.name }}:latest
