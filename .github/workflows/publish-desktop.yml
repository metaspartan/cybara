name: 'Publish Desktop App'

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number (e.g., 1.0.0)'
        required: false
        default: '1.0.0'

jobs:
  create-release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create-release.outputs.result }}
    steps:
      - uses: actions/checkout@v4
      - name: Create Release
        id: create-release
        uses: actions/github-script@v7
        with:
          script: |
            const { data } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: context.ref.startsWith('refs/tags/') ? context.ref.replace('refs/tags/', '') : `v${{ github.event.inputs.version || '1.0.0' }}`,
              name: `Cybara Desktop v${{ github.event.inputs.version || github.ref_name }}`,
              body: 'Download the appropriate installer for your platform below.',
              draft: true,
              prerelease: false
            })
            return data.id

  build-tauri:
    needs: create-release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS Universal (Intel + Apple Silicon)
          - platform: 'macos-latest'
            args: '--target universal-apple-darwin'
            target: 'universal-apple-darwin'
          # Windows x64
          - platform: 'windows-latest'
            args: ''
            target: 'x86_64-pc-windows-msvc'
          # Linux x64
          - platform: 'ubuntu-22.04'
            args: ''
            target: 'x86_64-unknown-linux-gnu'
          # Linux arm64
          - platform: 'ubuntu-22.04-arm'
            args: ''
            target: 'aarch64-unknown-linux-gnu'

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      # macOS: Install both targets for universal binary
      - name: Install macOS targets
        if: matrix.platform == 'macos-latest'
        run: |
          rustup target add aarch64-apple-darwin
          rustup target add x86_64-apple-darwin

      # Linux: Install system dependencies
      - name: Install Linux dependencies
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install dependencies
        run: bun install

      - name: Build UI
        run: bun run ui:build

      # Build the Bun sidecar for the target platform
      - name: Build Sidecar (macOS Universal)
        if: matrix.platform == 'macos-latest'
        run: |
          bun build src/index.ts --compile --target=bun-darwin-arm64 --outfile src-tauri/bin/cybara-aarch64-apple-darwin
          bun build src/index.ts --compile --target=bun-darwin-x64 --outfile src-tauri/bin/cybara-x86_64-apple-darwin

      - name: Build Sidecar (Windows)
        if: matrix.platform == 'windows-latest'
        run: |
          bun build src/index.ts --compile --target=bun-windows-x64 --outfile src-tauri/bin/cybara-x86_64-pc-windows-msvc.exe

      - name: Build Sidecar (Linux x64)
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          bun build src/index.ts --compile --target=bun-linux-x64 --outfile src-tauri/bin/cybara-x86_64-unknown-linux-gnu

      - name: Build Sidecar (Linux arm64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          bun build src/index.ts --compile --target=bun-linux-arm64 --outfile src-tauri/bin/cybara-aarch64-unknown-linux-gnu

      - name: Build Tauri App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: ${{ matrix.args }}

  publish-release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    needs: [create-release, build-tauri]
    steps:
      - name: Publish Release
        uses: actions/github-script@v7
        env:
          release_id: ${{ needs.create-release.outputs.release_id }}
        with:
          script: |
            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: process.env.release_id,
              draft: false
            })
