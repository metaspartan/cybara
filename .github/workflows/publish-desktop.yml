name: 'Publish Desktop Apps'

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number (e.g., 1.0.0)'
        required: false
        default: ''

# Pin Bun for reproducible release builds + skip puppeteer.
env:
  BUN_VERSION: '1.3.14'
  PUPPETEER_SKIP_DOWNLOAD: 'true'

jobs:
  # Quality gate: never publish desktop apps from a broken build.
  quality:
    name: CI Quality Gate
    permissions:
      contents: read
    runs-on: get32
    steps:
      - uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install root dependencies
        run: bun install --ignore-scripts && bun run scripts/postinstall.ts
      - name: Install UI dependencies
        run: cd ui && bun install
      - name: Run CI checks
        run: bun run check:ci

  create-release:
    needs: quality
    permissions:
      contents: write
    runs-on: get32
    outputs:
      release_id: ${{ steps.create-release.outputs.release_id }}
      tag_name: ${{ steps.create-release.outputs.tag_name }}
    steps:
      - uses: actions/checkout@v4
      - name: Create Release
        id: create-release
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const packageVersion = JSON.parse(fs.readFileSync('package.json', 'utf8')).version;
            const requestedVersion = `${{ github.event.inputs.version }}`.trim();
            const resolvedVersion = requestedVersion || packageVersion;
            const tagName = context.ref.startsWith('refs/tags/')
              ? context.ref.replace('refs/tags/', '')
              : `v${resolvedVersion}`;
            core.setOutput('tag_name', tagName);

            try {
              const existing = await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag: tagName,
              })
              core.setOutput('release_id', String(existing.data.id));
              return;
            } catch (error) {
              if (error.status !== 404) {
                throw error;
              }
            }

            const { data } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tagName,
              name: `Cybara Desktop ${tagName}`,
              body: 'Download the appropriate installer or native app bundle for your platform below.',
              draft: true,
              prerelease: false
            });
            core.setOutput('release_id', String(data.id));

  build-tauri:
    needs: create-release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS arm64
          - platform: 'macos-latest'
            args: '--target aarch64-apple-darwin'
            target: 'aarch64-apple-darwin'
            bun_target: 'bun-darwin-arm64'
            sidecar_out: 'src-tauri/bin/cybara-aarch64-apple-darwin'
          # macOS x64
          - platform: 'macos-latest'
            args: '--target x86_64-apple-darwin'
            target: 'x86_64-apple-darwin'
            bun_target: 'bun-darwin-x64'
            sidecar_out: 'src-tauri/bin/cybara-x86_64-apple-darwin'
          # Windows x64
          - platform: 'windows-latest'
            args: ''
            target: 'x86_64-pc-windows-msvc'
            bun_target: 'bun-windows-x64'
            sidecar_out: 'src-tauri/bin/cybara-x86_64-pc-windows-msvc.exe'
          # Linux x64
          - platform: 'ubuntu-22.04'
            args: ''
            target: 'x86_64-unknown-linux-gnu'
            bun_target: 'bun-linux-x64'
            sidecar_out: 'src-tauri/bin/cybara-x86_64-unknown-linux-gnu'
          # Linux arm64
          - platform: 'ubuntu-22.04-arm'
            args: ''
            target: 'aarch64-unknown-linux-gnu'
            bun_target: 'bun-linux-arm64'
            sidecar_out: 'src-tauri/bin/cybara-aarch64-unknown-linux-gnu'

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      # macOS: install the explicit target being bundled for deterministic updater keys.
      - name: Install macOS targets
        if: matrix.platform == 'macos-latest'
        run: |
          rustup target add ${{ matrix.target }}

      # Linux: Install system dependencies
      - name: Install Linux dependencies
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install dependencies
        run: bun install --ignore-scripts && bun run scripts/postinstall.ts

      - name: Sync version metadata
        env:
          CYBARA_RELEASE_VERSION: ${{ github.event.inputs.version }}
        run: bun run version:sync

      - name: Build UI
        run: bun run ui:build

      - name: Build Sidecar
        run: |
          bun build src/index.ts --compile --target=${{ matrix.bun_target }} --outfile ${{ matrix.sidecar_out }} --external electron

      - name: Prepare updater config
        env:
          CYBARA_TAURI_UPDATER_PUBKEY: ${{ secrets.TAURI_SIGNING_PUBLIC_KEY }}
          CYBARA_RELEASE_REPOSITORY: ${{ github.repository }}
        run: bun run tauri:prepare-release

      - name: Build Tauri App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          tagName: ${{ needs.create-release.outputs.tag_name }}
          args: ${{ matrix.args }} --config src-tauri/tauri.release.conf.json

  build-native-macos:
    needs: create-release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-13'
            arch: 'x86_64'
          - platform: 'macos-latest'
            arch: 'arm64'

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --ignore-scripts && bun run scripts/postinstall.ts

      - name: Sync version metadata
        env:
          CYBARA_RELEASE_VERSION: ${{ github.event.inputs.version }}
        run: bun run version:sync

      - name: Import Apple signing certificate
        if: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE_P12 != '' && secrets.APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD != '' && secrets.APPLE_KEYCHAIN_PASSWORD != '' }}
        env:
          APPLE_DEVELOPER_ID_CERTIFICATE_P12: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE_P12 }}
          APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD }}
          APPLE_KEYCHAIN_PASSWORD: ${{ secrets.APPLE_KEYCHAIN_PASSWORD }}
        run: |
          CERT_PATH="$RUNNER_TEMP/cybara-developer-id.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/cybara-build.keychain-db"
          printf '%s' "$APPLE_DEVELOPER_ID_CERTIFICATE_P12" > "$RUNNER_TEMP/cybara-cert.base64"
          base64 -D -i "$RUNNER_TEMP/cybara-cert.base64" -o "$CERT_PATH"
          security create-keychain -p "$APPLE_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$APPLE_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security default-keychain -d user -s "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -k "$KEYCHAIN_PATH" -P "$APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$APPLE_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

      - name: Configure Apple notary profile
        if: ${{ secrets.APPLE_ID != '' && secrets.APPLE_APP_SPECIFIC_PASSWORD != '' && secrets.APPLE_TEAM_ID != '' }}
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          xcrun notarytool store-credentials cybara-notary \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD"

      - name: Package native macOS app
        env:
          CYBARA_MACOS_SIGN_IDENTITY: ${{ secrets.APPLE_DEVELOPER_ID_SIGNING_IDENTITY }}
          HAS_APPLE_NOTARY: ${{ secrets.APPLE_ID != '' && secrets.APPLE_APP_SPECIFIC_PASSWORD != '' && secrets.APPLE_TEAM_ID != '' }}
        run: |
          if [ "$HAS_APPLE_NOTARY" = "true" ]; then
            export CYBARA_MACOS_NOTARY_KEYCHAIN_PROFILE=cybara-notary
          fi
          bun run native:macos:package

      - name: Upload native macOS release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.create-release.outputs.tag_name }}
          files: |
            release/native-macos/${{ matrix.arch }}/Cybara-native-macos-${{ matrix.arch }}-*.zip
            release/native-macos/${{ matrix.arch }}/Cybara-native-macos-${{ matrix.arch }}-*.sha256
          fail_on_unmatched_files: true

  publish-release:
    permissions:
      contents: write
    runs-on: get32
    needs: [create-release, build-tauri, build-native-macos]
    steps:
      # Guard: refuse to publish if the Tauri updater manifest is missing. A
      # release without latest.json ships a desktop app whose in-app updater
      # 404s forever. This happens when TAURI_SIGNING_PRIVATE_KEY is absent.
      - name: Verify updater manifest (latest.json) is present
        uses: actions/github-script@v7
        env:
          TAG_NAME: ${{ needs.create-release.outputs.tag_name }}
          release_id: ${{ needs.create-release.outputs.release_id }}
        with:
          script: |
            const tag = process.env.TAG_NAME || context.ref.replace('refs/tags/', '');
            if (!tag) {
              core.setFailed('Could not resolve release tag name.');
              return;
            }
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const assets = await github.paginate(github.rest.repos.listReleaseAssets, {
              owner,
              repo,
              release_id: Number(process.env.release_id || 0),
              per_page: 100,
            });
            core.info(`Release ${tag} has ${assets.length} assets.`);
            const names = assets.map((a) => a.name);
            core.info(`Assets: ${names.join(', ') || '(none)'}`);
            const hasManifest = names.some((n) => n === 'latest.json');
            if (!hasManifest) {
              core.setFailed(
                'latest.json updater manifest is missing from this release. ' +
                'This usually means TAURI_SIGNING_PRIVATE_KEY is not configured, ' +
                'so tauri-action skipped updater artifacts. Set the Tauri signing ' +
                'secrets (see docs/desktop.md) and re-run, or the desktop in-app ' +
                'updater will break for all users.'
              );
              return;
            }
            core.info('latest.json present — updater will resolve correctly.');
      - name: Publish Release
        uses: actions/github-script@v7
        env:
          release_id: ${{ needs.create-release.outputs.release_id }}
        with:
          script: |
            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: process.env.release_id,
              draft: false
            })
