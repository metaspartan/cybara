name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Pin Bun for reproducible CI runs + skip browser downloads.
env:
  BUN_VERSION: "1.3.14"
  PUPPETEER_SKIP_DOWNLOAD: "true"
  SKIP_SPAWN_TESTS: "1"

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install root dependencies
        run: bash scripts/ci-install.sh --ignore-scripts && bun run scripts/postinstall.ts

      - name: Install UI dependencies
        run: cd ui && bash ../scripts/ci-install.sh

      - name: Install mobile dependencies
        run: cd apps/mobile && bash ../../scripts/ci-install.sh

      - name: Run CI checks
        run: bun run check:ci

      - name: Security audit
        run: bun run audit:ci

  native-macos:
    name: Native macOS
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Build SwiftPM package
        run: swift build --package-path apps/macos/Cybara

      - name: Run SwiftPM tests
        run: swift test --package-path apps/macos/Cybara
