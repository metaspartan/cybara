name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

# Pin Bun for reproducible CI runs + skip puppeteer browser download.
env:
  BUN_VERSION: '1.3.14'
  PUPPETEER_SKIP_DOWNLOAD: 'true'

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install root dependencies
        run: bun install --ignore-scripts && bun run scripts/postinstall.ts

      - name: Install UI dependencies
        run: cd ui && bun install

      - name: Run CI checks
        run: bun run check:ci
