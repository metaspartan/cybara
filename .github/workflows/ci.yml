name: CI

on:
  workflow_dispatch: {}
  push:
    branches:
      - main
      - master
      - dev
  pull_request: {}
  merge_group: {}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  BUN_VERSION: "1.3.14"
  PUPPETEER_SKIP_DOWNLOAD: "true"
  SKIP_SPAWN_TESTS: "1"

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install root dependencies
        run: bash scripts/ci-install.sh --ignore-scripts && bun run scripts/postinstall.ts

      - name: Install UI dependencies
        run: cd ui && bash ../scripts/ci-install.sh

      - name: Install mobile dependencies
        run: cd apps/mobile && bash ../../scripts/ci-install.sh

      - name: Install site dependencies
        run: cd site && bash ../scripts/ci-install.sh

      - name: Sync version metadata
        run: |
          VERSION="$(bun -e 'const pkg = await Bun.file("package.json").json(); console.log(pkg.version);')"
          CYBARA_RELEASE_VERSION="$VERSION" bun run version:sync

      - name: Run CI checks
        run: bun run check:ci
        env:
          REACT_DOCTOR_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}

      - name: Security audit
        run: bun run audit:ci

      - name: Build production surfaces
        run: |
          bun run build:all
          cd site && bun run build

      - name: Build mobile Expo bundles
        run: |
          cd apps/mobile
          bunx expo export --platform ios --output-dir /tmp/cybara-expo-ios
          bunx expo export --platform android --output-dir /tmp/cybara-expo-android

  native-macos:
    name: Native macOS
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build SwiftPM package
        run: swift build --package-path apps/macos/Cybara

      - name: Run SwiftPM tests
        run: swift test --package-path apps/macos/Cybara

  darwin-x64-cli-build:
    name: Build CLI darwin-x64
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install root dependencies
        run: bash scripts/ci-install.sh --ignore-scripts && bun run scripts/postinstall.ts

      - name: Build UI
        run: cd ui && bash ../scripts/ci-install.sh && bun run build

      - name: Build Darwin x64 CLI
        env:
          CYBARA_BUILD_COMMIT: ${{ github.sha }}
        run: |
          bun run scripts/build-standalone-cli.ts bun-darwin-x64 cybara-darwin-x64

      - name: Upload Darwin x64 CLI
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-cybara-darwin-x64
          path: cybara-darwin-x64
          retention-days: 7

  darwin-x64-cli-smoke:
    name: Smoke CLI darwin-x64
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    needs: darwin-x64-cli-build
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download Darwin x64 CLI
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ci-cybara-darwin-x64

      - name: Ensure Rosetta is available
        run: |
          if ! arch -x86_64 /usr/bin/true; then
            sudo softwareupdate --install-rosetta --agree-to-license
          fi

      - name: Run Darwin x64 CLI lifecycle
        env:
          CYBARA_SMOKE_HOME: ${{ runner.temp }}/cybara-darwin-x64-home
        run: bash scripts/smoke-standalone-cli.sh ./cybara-darwin-x64
