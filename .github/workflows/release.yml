name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  BUN_VERSION: "1.3.14"
  PUPPETEER_SKIP_DOWNLOAD: "true"
  SKIP_SPAWN_TESTS: "1"
  # On a tagged release the ref name IS the version (e.g. v1.0.476). version:sync
  # strips the leading "v" and uses it verbatim, so the shallow CI checkout can't
  # miscompute the version from the commit count. Branch dispatches (ref_name not
  # a semver) fall back to the commit-count computation.
  CYBARA_RELEASE_VERSION: ${{ github.ref_name }}

jobs:
  # ── Quality gate ────────────────────────────────────────────────────────────
  quality:
    name: CI Quality Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 2
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install root dependencies
        run: bash scripts/ci-install.sh --ignore-scripts && bun run scripts/postinstall.ts
      - name: Install UI dependencies
        run: cd ui && bash ../scripts/ci-install.sh
      - name: Install mobile dependencies
        run: cd apps/mobile && bash ../../scripts/ci-install.sh
      - name: Sync version metadata
        run: bun run version:sync
      - name: Run CI checks
        run: bun run check:ci
      - name: Security audit
        run: bun run audit:ci

  # ── CLI binaries (cross-compiled on a Linux runner) ─────────────────────────
  build-cli:
    name: CLI ${{ matrix.target }}
    needs: quality
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            artifact: cybara-linux-x64
          - target: linux-arm64
            artifact: cybara-linux-arm64
          - target: darwin-x64
            artifact: cybara-darwin-x64
          - target: darwin-arm64
            artifact: cybara-darwin-arm64
          - target: windows-x64
            artifact: cybara-windows-x64.exe
          - target: windows-arm64
            artifact: cybara-windows-arm64.exe
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install dependencies
        run: bash scripts/ci-install.sh --ignore-scripts && bun run scripts/postinstall.ts
      - name: Sync version metadata
        run: bun run version:sync
      - name: Type check
        run: bun run typecheck
      - name: Build UI
        run: cd ui && bash ../scripts/ci-install.sh && bun run build
      - name: Build TypeScript
        run: bun run build
      - name: Cross-compile CLI binary
        env:
          CYBARA_BUILD_COMMIT: ${{ github.sha }}
        run: |
          bun run scripts/build-standalone-cli.ts bun-${{ matrix.target }} ${{ matrix.artifact }}
      - name: Upload CLI artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}
          retention-days: 30

  smoke-cli-darwin-x64:
    name: Smoke CLI darwin-x64
    needs: build-cli
    runs-on: macos-26
    steps:
      - name: Download Darwin x64 CLI artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: cybara-darwin-x64
      - name: Run Darwin x64 CLI lifecycle
        run: |
          chmod +x cybara-darwin-x64
          export HOME="$RUNNER_TEMP/cybara-darwin-x64-home"
          mkdir -p "$HOME"
          ./cybara-darwin-x64 version
          ./cybara-darwin-x64 start -d
          ./cybara-darwin-x64 status
          ./cybara-darwin-x64 stop

  # ── Tauri desktop apps (platform-native builds) ────────────────────────────
  build-tauri:
    name: Tauri ${{ matrix.rust_target }}
    needs: quality
    # Tauri builds are best-effort — they don't block the CLI release.
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS arm64 — native build on Apple Silicon (macos-26)
          - platform: macos
            runner: macos-26
            args: "--target aarch64-apple-darwin"
            rust_target: aarch64-apple-darwin
            bun_target: bun-darwin-arm64
            sidecar: "src-tauri/bin/cybara-aarch64-apple-darwin"
          # macOS x64 — cross-compiled on Apple Silicon (macos-26). The Intel
          # macos-13 runners are deprecated/scarce and can queue for hours; Rust
          # cross-compiles x86_64 fine with the target added below, and the bun
          # sidecar cross-compiles via its own --target.
          - platform: macos
            runner: macos-26
            args: "--target x86_64-apple-darwin"
            rust_target: x86_64-apple-darwin
            bun_target: bun-darwin-x64
            sidecar: "src-tauri/bin/cybara-x86_64-apple-darwin"
          # Windows x64 — GitHub-hosted Windows runner
          - platform: windows
            runner: windows-latest
            args: ""
            rust_target: x86_64-pc-windows-msvc
            bun_target: bun-windows-x64
            sidecar: "src-tauri/bin/cybara-x86_64-pc-windows-msvc.exe"
          # Linux x64 — GitHub-hosted Linux runner
          - platform: linux
            runner: ubuntu-22.04
            args: "--bundles deb,rpm"
            rust_target: x86_64-unknown-linux-gnu
            bun_target: bun-linux-x64
            sidecar: "src-tauri/bin/cybara-x86_64-unknown-linux-gnu"
            appimage: true
          # Linux arm64 — native GitHub-hosted ARM runner (Raspberry Pi, ARM servers).
          # Native build on aarch64, so the sidecar, Rust target, and AppImage
          # tooling all run natively. linuxdeploy/appimagetool publish aarch64
          # AppImages, and tauri-bundler selects them from the target triple, so
          # the AppImage bundle builds natively on this runner.
          - platform: linux
            runner: ubuntu-24.04-arm
            args: "--bundles deb,rpm"
            rust_target: aarch64-unknown-linux-gnu
            bun_target: bun-linux-arm64
            sidecar: "src-tauri/bin/cybara-aarch64-unknown-linux-gnu"
            appimage: true

    runs-on: ${{ matrix.runner }}
    env:
      HAS_MACOS_SIGNING: ${{ secrets.MACOS_CERTIFICATE != '' && secrets.MACOS_CERTIFICATE_PASSWORD != '' && secrets.MACOS_SIGN_IDENTITY != '' }}
      HAS_MACOS_NOTARY: ${{ secrets.MACOS_NOTARY_API_KEY != '' && secrets.MACOS_NOTARY_API_KEY_ID != '' && secrets.MACOS_NOTARY_API_ISSUER_ID != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install Rust stable (non-Windows)
        if: matrix.platform != 'windows'
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          targets: ${{ matrix.rust_target }}
      # dtolnay/rust-toolchain runs its setup via `shell: bash`, which on the
      # self-hosted Windows runner resolves to WSL's bash (System32\bash.exe)
      # and mangles Windows paths ("No such file or directory"). Install via
      # rustup in the native (PowerShell) shell instead. (Permanent fix: remove
      # WSL bash from the runner so `shell: bash` uses git-bash.)
      - name: Install Rust stable (Windows)
        if: matrix.platform == 'windows'
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          rustup target add ${{ matrix.rust_target }}
      - name: Install Linux dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          FUSE_PACKAGE="libfuse2"
          if ! apt-cache show "$FUSE_PACKAGE" >/dev/null 2>&1; then
            FUSE_PACKAGE="libfuse2t64"
          fi
          sudo apt-get install -y \
            appstream \
            build-essential \
            curl \
            desktop-file-utils \
            file \
            libayatana-appindicator3-dev \
            libasound2-dev \
            libglib2.0-dev \
            libgtk-3-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            patchelf \
            pkg-config \
            wget \
            xdg-utils \
            zsync \
            "$FUSE_PACKAGE"
      # Split into two steps (no '&&') so it runs under each OS's native shell
      # — bash on Linux/macOS, PowerShell on the self-hosted Windows runner —
      # On the hosted Windows runner `shell: bash` is git-bash (not WSL), so the
      # resilient-install script runs identically across Linux, macOS, and Windows.
      - name: Install dependencies
        shell: bash
        run: bash scripts/ci-install.sh --ignore-scripts
      - name: Run postinstall
        run: bun run scripts/postinstall.ts
      - name: Install Windows browser preview runtime
        if: matrix.platform == 'windows'
        env:
          PLAYWRIGHT_BROWSERS_PATH: "0"
          PLAYWRIGHT_SKIP_BROWSER_GC: "1"
        run: bunx playwright install --only-shell chromium
      - name: Sync version metadata
        run: bun run version:sync
      - name: Build UI
        run: bun run ui:build
      - name: Build Sidecar binary
        env:
          CYBARA_SIDECAR_BUN_TARGET: ${{ matrix.bun_target }}
        run: bun run scripts/build-sidecar.ts
      - name: Prepare updater config
        env:
          CYBARA_TAURI_UPDATER_PUBKEY: ${{ secrets.TAURI_SIGNING_PUBLIC_KEY }}
          CYBARA_RELEASE_REPOSITORY: ${{ github.repository }}
        run: bun run tauri:prepare-release
      # Stage the App Store Connect API key (.p8) only when the full Apple
      # signing/notarization secret set exists. Passing empty Apple env vars to
      # tauri-action makes it attempt an invalid keychain import.
      - name: Prepare Apple notary key (macOS)
        if: matrix.platform == 'macos' && env.HAS_MACOS_SIGNING == 'true' && env.HAS_MACOS_NOTARY == 'true'
        shell: bash
        env:
          MACOS_NOTARY_API_KEY: ${{ secrets.MACOS_NOTARY_API_KEY }}
        run: |
          set -euo pipefail
          echo "$MACOS_NOTARY_API_KEY" | base64 --decode > "$RUNNER_TEMP/notary_key.p8"
          echo "Apple notary key staged for notarization."
      - name: Import Apple signing certificate for sidecar resources (macOS)
        if: matrix.platform == 'macos' && env.HAS_MACOS_SIGNING == 'true'
        shell: bash
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/cybara-tauri-sidecar-signing.keychain-db"
          KC_PW="${MACOS_KEYCHAIN_PASSWORD:-cybara-ci}"
          security create-keychain -p "$KC_PW" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KC_PW" "$KEYCHAIN"
          echo "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/tauri-sidecar-cert.p12"
          security import "$RUNNER_TEMP/tauri-sidecar-cert.p12" -k "$KEYCHAIN" \
            -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KC_PW" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" \
            $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/tauri-sidecar-cert.p12"
      - name: Sign Tauri sidecar runtime resources (macOS)
        if: matrix.platform == 'macos' && env.HAS_MACOS_SIGNING == 'true'
        env:
          CYBARA_MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
        run: bun run scripts/codesign-tauri-sidecar-runtime.ts
      - name: Build Tauri App (unsigned/no Apple signing)
        if: matrix.platform != 'macos' || env.HAS_MACOS_SIGNING != 'true'
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          TAURI_BUNDLER_DMG_IGNORE_CI: "false"
          NO_STRIP: "true"
          APPIMAGE_EXTRACT_AND_RUN: "1"
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Cybara ${{ github.ref_name }}"
          releaseBody: "Download the appropriate installer for your platform below."
          releaseDraft: true
          includeUpdaterJson: false
          args: ${{ matrix.args }} --config src-tauri/tauri.release.conf.json
      # linuxdeploy aborts when `ldd` exits non-zero on the Bun-compiled sidecar
      # (bun --compile ELFs make ldd fail even though the binary runs fine).
      # Shim ldd so failures report "statically linked" and linuxdeploy skips
      # dependency deployment for that binary instead of crashing.
      - name: Shim ldd for Bun sidecar (AppImage)
        if: matrix.platform == 'linux' && matrix.appimage == true
        run: |
          mkdir -p "$RUNNER_TEMP/ldd-shim"
          cat > "$RUNNER_TEMP/ldd-shim/ldd" <<'EOF'
          #!/bin/bash
          out=$(/usr/bin/ldd "$@" 2>&1)
          code=$?
          if [ $code -ne 0 ]; then
            printf '\tstatically linked\n'
            exit 0
          fi
          printf '%s\n' "$out"
          exit $code
          EOF
          chmod +x "$RUNNER_TEMP/ldd-shim/ldd"
          echo "$RUNNER_TEMP/ldd-shim" >> "$GITHUB_PATH"
      - name: Build Linux AppImage (best-effort)
        if: matrix.platform == 'linux' && matrix.appimage == true
        continue-on-error: true
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          NO_STRIP: "true"
          APPIMAGE_EXTRACT_AND_RUN: "1"
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Cybara ${{ github.ref_name }}"
          releaseBody: "Download the appropriate installer for your platform below."
          releaseDraft: true
          includeUpdaterJson: false
          args: --verbose --bundles appimage --config src-tauri/tauri.release.conf.json
      - name: Build Tauri App (signed macOS)
        if: matrix.platform == 'macos' && env.HAS_MACOS_SIGNING == 'true' && env.HAS_MACOS_NOTARY != 'true'
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          TAURI_BUNDLER_DMG_IGNORE_CI: "false"
          NO_STRIP: "true"
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Cybara ${{ github.ref_name }}"
          releaseBody: "Download the appropriate installer for your platform below."
          releaseDraft: true
          includeUpdaterJson: false
          args: ${{ matrix.args }} --config src-tauri/tauri.release.conf.json
      - name: Build Tauri App (signed and notarized macOS)
        if: matrix.platform == 'macos' && env.HAS_MACOS_SIGNING == 'true' && env.HAS_MACOS_NOTARY == 'true'
        id: build_tauri_notarized_macos
        continue-on-error: true
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.MACOS_NOTARY_API_ISSUER_ID }}
          APPLE_API_KEY: ${{ secrets.MACOS_NOTARY_API_KEY_ID }}
          APPLE_API_KEY_PATH: ${{ format('{0}/notary_key.p8', runner.temp) }}
          TAURI_BUNDLER_DMG_IGNORE_CI: "false"
          NO_STRIP: "true"
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Cybara ${{ github.ref_name }}"
          releaseBody: "Download the appropriate installer for your platform below."
          releaseDraft: true
          includeUpdaterJson: false
          args: ${{ matrix.args }} --config src-tauri/tauri.release.conf.json
      - name: Reset macOS disk image state
        if: matrix.platform == 'macos' && steps.build_tauri_notarized_macos.outcome == 'failure'
        shell: bash
        run: |
          set -euo pipefail
          while read -r device; do
            hdiutil detach "$device" -force || true
          done < <(hdiutil info | awk '/\/Volumes\/Cybara/{print $1}')
          pkill -9 diskimages-helper || true
          rm -rf "src-tauri/target/${{ matrix.rust_target }}/release/bundle/dmg"
          sleep 5
      - name: Retry Tauri App (signed and notarized macOS)
        if: matrix.platform == 'macos' && steps.build_tauri_notarized_macos.outcome == 'failure'
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.MACOS_NOTARY_API_ISSUER_ID }}
          APPLE_API_KEY: ${{ secrets.MACOS_NOTARY_API_KEY_ID }}
          APPLE_API_KEY_PATH: ${{ format('{0}/notary_key.p8', runner.temp) }}
          TAURI_BUNDLER_DMG_IGNORE_CI: "false"
          NO_STRIP: "true"
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Cybara ${{ github.ref_name }}"
          releaseBody: "Download the appropriate installer for your platform below."
          releaseDraft: true
          includeUpdaterJson: false
          args: ${{ matrix.args }} --config src-tauri/tauri.release.conf.json
      - name: Clean up Tauri sidecar signing keychain
        if: always() && matrix.platform == 'macos' && env.HAS_MACOS_SIGNING == 'true'
        run: security delete-keychain "$RUNNER_TEMP/cybara-tauri-sidecar-signing.keychain-db" || true

  # ── Native macOS app (SwiftUI shell) — signed + notarized ───────────────────
  build-native-macos:
    name: Native macOS ${{ matrix.arch }}
    needs: quality
    # Best-effort: the native app doesn't block the CLI release.
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            # macOS 26 (Xcode 26) SDK is required: the app references the
            # Liquid Glass `glassEffect` API and relies on macOS 26 SDK Sendable
            # annotations. `if #available` only gates runtime, not the compile
            # SDK, so an older SDK (macos-15 → Xcode 16) can't build it at all.
            runner: macos-26
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 105
    env:
      # Mapped from secrets so steps can gate on presence. Leave the secrets
      # unset to produce an unsigned (Gatekeeper-quarantined) build instead.
      MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
      MACOS_KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
      MACOS_NOTARY_API_KEY: ${{ secrets.MACOS_NOTARY_API_KEY }}
      MACOS_NOTARY_API_KEY_ID: ${{ secrets.MACOS_NOTARY_API_KEY_ID }}
      MACOS_NOTARY_API_ISSUER_ID: ${{ secrets.MACOS_NOTARY_API_ISSUER_ID }}
      HAS_NATIVE_MACOS_SIGNING: ${{ secrets.MACOS_CERTIFICATE != '' && secrets.MACOS_CERTIFICATE_PASSWORD != '' && secrets.MACOS_SIGN_IDENTITY != '' }}
      HAS_NATIVE_MACOS_NOTARY: ${{ secrets.MACOS_NOTARY_API_KEY != '' && secrets.MACOS_NOTARY_API_KEY_ID != '' && secrets.MACOS_NOTARY_API_ISSUER_ID != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install dependencies
        run: bash scripts/ci-install.sh --ignore-scripts
      - name: Install mobile dependencies
        run: cd apps/mobile && bash ../../scripts/ci-install.sh
      - name: Run postinstall
        run: bun run scripts/postinstall.ts
      - name: Sync version metadata
        run: bun run version:sync
      - name: Run native-app unit tests
        run: |
          # Detect full Xcode via xctest availability rather than matching the
          # app name (hosted runners use versioned paths like Xcode_16.4.app).
          if xcrun --find xctest >/dev/null 2>&1; then
            swift test --package-path apps/macos/Cybara
          else
            echo "::warning::Full Xcode not selected ($(xcode-select -p 2>/dev/null)); XCTest unavailable, skipping native unit tests"
          fi
      - name: Import signing certificate
        if: env.HAS_NATIVE_MACOS_SIGNING == 'true'
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/cybara-signing.keychain-db"
          KC_PW="${MACOS_KEYCHAIN_PASSWORD:-cybara-ci}"
          security create-keychain -p "$KC_PW" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KC_PW" "$KEYCHAIN"
          echo "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" \
            -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KC_PW" "$KEYCHAIN" >/dev/null
          # Prepend the temp keychain to the search list so codesign can find it.
          security list-keychains -d user -s "$KEYCHAIN" \
            $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/cert.p12"
      - name: Store notarization credentials
        if: env.HAS_NATIVE_MACOS_SIGNING == 'true' && env.HAS_NATIVE_MACOS_NOTARY == 'true'
        run: |
          set -euo pipefail
          echo "$MACOS_NOTARY_API_KEY" | base64 --decode > "$RUNNER_TEMP/notary.p8"
          xcrun notarytool store-credentials cybara-notary \
            --key "$RUNNER_TEMP/notary.p8" \
            --key-id "$MACOS_NOTARY_API_KEY_ID" \
            --issuer "$MACOS_NOTARY_API_ISSUER_ID"
          rm -f "$RUNNER_TEMP/notary.p8"
      - name: Package native macOS app
        env:
          # The packaging script signs only when the identity is set, and
          # notarizes only when the profile is set (requires the identity too).
          CYBARA_MACOS_SIGN_IDENTITY: ${{ env.MACOS_SIGN_IDENTITY }}
          CYBARA_MACOS_NOTARY_KEYCHAIN_PROFILE: ${{ env.HAS_NATIVE_MACOS_SIGNING == 'true' && env.HAS_NATIVE_MACOS_NOTARY == 'true' && 'cybara-notary' || '' }}
          CYBARA_MACOS_NOTARY_TIMEOUT_MINUTES: "90"
          CYBARA_MACOS_NOTARY_POLL_SECONDS: "30"
        run: bun run scripts/package-native-macos.ts
      - name: Clean up signing keychain
        if: always() && env.HAS_NATIVE_MACOS_SIGNING == 'true'
        run: security delete-keychain "$RUNNER_TEMP/cybara-signing.keychain-db" || true
      - name: Upload native macOS artifact to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            release/native-macos/${{ matrix.arch }}/*.zip
            release/native-macos/${{ matrix.arch }}/*.sha256
          draft: true
          prerelease: ${{ contains(github.ref, 'alpha') || contains(github.ref, 'beta') || contains(github.ref, 'rc') }}

  # ── React Native mobile app (Expo update bundles) ──────────────────────────
  build-mobile:
    name: Mobile Expo bundles
    needs: quality
    runs-on: ubuntu-latest
    env:
      EXPO_NO_TELEMETRY: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      # Expo / React Native CLI shell out to `node` for autolinking and export;
      # a real Node runtime must be on PATH.
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: bash scripts/ci-install.sh --ignore-scripts
      - name: Run postinstall
        run: bun run scripts/postinstall.ts
      - name: Sync version metadata
        run: bun run version:sync
      - name: Check Expo dependency compatibility
        run: bun run mobile:expo-check
      - name: Type check mobile app
        run: bun run mobile:typecheck
      - name: Export iOS and Android bundles
        run: |
          set -euo pipefail
          rm -rf release/mobile/expo
          mkdir -p release/mobile/expo
          cd apps/mobile
          bunx expo export --platform ios --output-dir ../../release/mobile/expo/ios
          bunx expo export --platform android --output-dir ../../release/mobile/expo/android
      - name: Package mobile release artifact
        run: |
          set -euo pipefail
          MOBILE_REF="${GITHUB_REF_NAME:-${GITHUB_SHA}}"
          MOBILE_REF="${MOBILE_REF//\//-}"
          cp apps/mobile/app.json release/mobile/expo/app.json
          cp apps/mobile/package.json release/mobile/expo/package.json
          tar -czf "release/mobile/cybara-mobile-expo-${MOBILE_REF}.tar.gz" -C release/mobile expo
      - name: Upload mobile artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cybara-mobile-expo
          path: release/mobile/*.tar.gz
          retention-days: 30

  # ── Android APK (local Gradle build via Expo prebuild) ─────────────────────
  build-android:
    name: Android APK
    needs: quality
    continue-on-error: true
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    env:
      CYBARA_RELEASE_VERSION: ${{ github.ref_name }}
      EXPO_NO_TELEMETRY: "1"
      GOOGLE_PLAY_PUBLISH_CONFIGURED: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      # React Native / Expo Gradle scripts shell out to `node` for autolinking;
      # Bun alone is not enough, so a real Node runtime must be on PATH.
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
      - name: Setup Java
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Setup Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
      - name: Install dependencies
        run: bash scripts/ci-install.sh --ignore-scripts && bun run scripts/postinstall.ts
      - name: Install mobile dependencies
        run: cd apps/mobile && bash ../../scripts/ci-install.sh
      - name: Sync version metadata
        run: bun run version:sync
      - name: Prebuild Android project
        run: cd apps/mobile && bunx expo prebuild --platform android --no-install
      - name: Tune Android Gradle memory
        run: |
          set -euo pipefail
          cd apps/mobile/android
          PROPS="gradle.properties"
          set_prop() {
            local key="$1"
            local value="$2"
            if grep -q "^${key}=" "$PROPS"; then
              sed -i.bak "s|^${key}=.*|${key}=${value}|" "$PROPS"
              rm -f "${PROPS}.bak"
            else
              printf '\n%s=%s\n' "$key" "$value" >> "$PROPS"
            fi
          }
          set_prop "org.gradle.jvmargs" "-Xmx4g -XX:MaxMetaspaceSize=1536m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8"
          set_prop "kotlin.daemon.jvmargs" "-Xmx2g -XX:MaxMetaspaceSize=1536m -Dfile.encoding=UTF-8"
          set_prop "org.gradle.workers.max" "2"
          grep -E '^(org.gradle.jvmargs|kotlin.daemon.jvmargs|org.gradle.workers.max)=' "$PROPS"
      # Signed release AAB (for Google Play) + APK when a keystore is configured;
      # otherwise a debug-signed APK that is installable for sideloading.
      - name: Build Android artifacts
        id: build
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          cd apps/mobile/android
          if [ -n "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > upload.keystore
            KS="$(pwd)/upload.keystore"
            ./gradlew bundleRelease assembleRelease --no-daemon -x lint \
              -Pandroid.injected.signing.store.file="$KS" \
              -Pandroid.injected.signing.store.password="$ANDROID_KEYSTORE_PASSWORD" \
              -Pandroid.injected.signing.key.alias="$ANDROID_KEY_ALIAS" \
              -Pandroid.injected.signing.key.password="$ANDROID_KEY_PASSWORD"
            rm -f upload.keystore
            AAB="$(find app/build/outputs/bundle -name '*.aab' | head -1)"
            APK="$(find app/build/outputs/apk/release -name '*.apk' | head -1)"
          else
            ./gradlew assembleDebug --no-daemon -x lint
            AAB=""
            APK="$(find app/build/outputs/apk -name '*.apk' | head -1)"
          fi
          cd "$GITHUB_WORKSPACE"
          OUT_APK="cybara-v${VERSION}-android.apk"
          [ -n "$APK" ] && cp "apps/mobile/android/$APK" "$OUT_APK" && echo "apk=$OUT_APK" >> "$GITHUB_OUTPUT"
          if [ -n "$AAB" ]; then
            OUT_AAB="cybara-v${VERSION}-android.aab"
            cp "apps/mobile/android/$AAB" "$OUT_AAB"
            echo "aab=$OUT_AAB" >> "$GITHUB_OUTPUT"
          fi
      - name: Upload Android artifacts to release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            ${{ steps.build.outputs.apk }}
            ${{ steps.build.outputs.aab }}
          draft: true
          prerelease: ${{ contains(github.ref, 'alpha') || contains(github.ref, 'beta') || contains(github.ref, 'rc') }}
      # Publishes the signed AAB to the Play Console internal track when a
      # service-account key is configured. No-op otherwise.
      - name: Publish to Google Play
        if: steps.build.outputs.aab != '' && env.GOOGLE_PLAY_PUBLISH_CONFIGURED == 'true'
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.ck.cybara
          releaseFiles: ${{ steps.build.outputs.aab }}
          tracks: internal
          status: completed

  # ── iOS build (local Xcode build via Expo prebuild) ────────────────────────
  # Produces a signed .ipa only when Apple signing secrets are configured;
  # otherwise best-effort archives for inspection. Requires a macOS runner.
  build-ios:
    name: iOS build
    needs: quality
    continue-on-error: true
    if: startsWith(github.ref, 'refs/tags/')
    # macOS 26 (Xcode 26) provides the iOS 26 SDK that expo-glass-effect's native
    # Liquid Glass views compile against.
    runs-on: macos-26
    env:
      CYBARA_RELEASE_VERSION: ${{ github.ref_name }}
      EXPO_NO_TELEMETRY: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: bash scripts/ci-install.sh --ignore-scripts && bun run scripts/postinstall.ts
      - name: Install mobile dependencies
        run: cd apps/mobile && bash ../../scripts/ci-install.sh
      - name: Sync version metadata
        run: bun run version:sync
      - name: Prebuild iOS project
        run: cd apps/mobile && bunx expo prebuild --platform ios --no-install
      # expo prebuild --no-install skips CocoaPods, so the .xcworkspace that
      # xcodebuild needs (and the native pods, e.g. expo-glass-effect) won't
      # exist. Install pods explicitly against the generated project.
      - name: Install CocoaPods
        run: cd apps/mobile/ios && pod install --repo-update
      - name: Reclaim iOS build space
        run: |
          rm -rf "$HOME/.bun/install/cache" "$HOME/Library/Caches/CocoaPods"
          df -h
      # Signed App Store archive → TestFlight when Apple signing secrets are
      # present; otherwise an unsigned archive packaged as a .ipa for inspection.
      - name: Build iOS artifact
        id: ipa
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          cd apps/mobile/ios
          SCHEME="$(xcodebuild -list -json | bun -e 'const d=await Bun.stdin.json();console.log(d.project.schemes[0])')"
          archive_ios() {
            local log="$RUNNER_TEMP/cybara-xcode-archive.log"
            local status=0
            set +e
            xcodebuild -workspace *.xcworkspace -scheme "$SCHEME" -configuration Release \
              -sdk iphoneos -archivePath build/Cybara.xcarchive "$@" archive 2>&1 | tee "$log"
            status="${PIPESTATUS[0]}"
            set -e
            if [ "$status" -eq 0 ]; then
              return 0
            fi
            if ! grep -Eq 'Input/output error|No space left on device' "$log"; then
              return "$status"
            fi
            rm -rf "$HOME/Library/Developer/Xcode/DerivedData"/* build/Cybara.xcarchive
            df -h
            xcodebuild -workspace *.xcworkspace -scheme "$SCHEME" -configuration Release \
              -sdk iphoneos -archivePath build/Cybara.xcarchive "$@" archive
          }
          if [ -n "${APPLE_CERTIFICATE_BASE64:-}" ] && [ -n "${APPLE_PROVISIONING_PROFILE_BASE64:-}" ]; then
            KEYCHAIN="$RUNNER_TEMP/cybara.keychain-db"
            KPW="$(openssl rand -hex 16)"
            security create-keychain -p "$KPW" "$KEYCHAIN"
            security set-keychain-settings -lut 3600 "$KEYCHAIN"
            security unlock-keychain -p "$KPW" "$KEYCHAIN"
            echo "$APPLE_CERTIFICATE_BASE64" | base64 -d > cert.p12
            security import cert.p12 -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
            security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
            security set-key-partition-list -S apple-tool:,apple: -k "$KPW" "$KEYCHAIN" >/dev/null
            mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
            echo "$APPLE_PROVISIONING_PROFILE_BASE64" | base64 -d > cybara.mobileprovision
            security cms -D -i cybara.mobileprovision > profile.plist
            PROFILE_UUID="$(/usr/libexec/PlistBuddy -c 'Print :UUID' profile.plist)"
            PROFILE_NAME="$(/usr/libexec/PlistBuddy -c 'Print :Name' profile.plist)"
            PROFILE_APP_ID="$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' profile.plist)"
            if [[ "$PROFILE_APP_ID" != "$APPLE_TEAM_ID.com.ck.cybara" ]]; then
              echo "Provisioning profile app id '$PROFILE_APP_ID' does not match $APPLE_TEAM_ID.com.ck.cybara" >&2
              exit 1
            fi
            cp cybara.mobileprovision "$HOME/Library/MobileDevice/Provisioning Profiles/${PROFILE_UUID}.mobileprovision"
            PROFILE_HAS_PUSH="$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:aps-environment' profile.plist 2>/dev/null || true)"
            if [ -z "$PROFILE_HAS_PUSH" ]; then
              for ENT in $(find . -name '*.entitlements'); do
                /usr/libexec/PlistBuddy -c 'Delete :aps-environment' "$ENT" 2>/dev/null || true
              done
            fi
            {
              echo '<?xml version="1.0" encoding="UTF-8"?>'
              echo '<plist version="1.0"><dict>'
              echo '<key>method</key><string>app-store-connect</string>'
              echo "<key>teamID</key><string>${APPLE_TEAM_ID}</string>"
              echo '<key>signingStyle</key><string>manual</string>'
              echo '<key>provisioningProfiles</key><dict>'
              echo "<key>com.ck.cybara</key><string>${PROFILE_NAME}</string>"
              echo '</dict>'
              echo '</dict></plist>'
            } > exportOptions.plist
            archive_ios \
              DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
              CODE_SIGN_STYLE=Manual \
              CODE_SIGN_IDENTITY="Apple Distribution" \
              PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
              PRODUCT_BUNDLE_IDENTIFIER=com.ck.cybara
            xcodebuild -exportArchive -archivePath build/Cybara.xcarchive \
              -exportOptionsPlist exportOptions.plist -exportPath build/export
            IPA="$(find build/export -name '*.ipa' | head -1)"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            archive_ios CODE_SIGNING_ALLOWED=NO
            APP="$(find build/Cybara.xcarchive/Products/Applications -maxdepth 1 -name '*.app' | head -1)"
            mkdir -p Payload && cp -R "$APP" Payload/
            IPA="unsigned.ipa"; zip -qr "$IPA" Payload
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi
          OUT="$GITHUB_WORKSPACE/cybara-v${VERSION}-ios.ipa"
          cp "$IPA" "$OUT"
          echo "path=$OUT" >> "$GITHUB_OUTPUT"
      # Upload to TestFlight when an App Store Connect API key is configured.
      - name: Upload to TestFlight
        if: steps.ipa.outputs.signed == 'true' && env.ASC_KEY != ''
        env:
          ASC_KEY: ${{ secrets.ASC_API_KEY_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
          TESTFLIGHT_UPLOAD_ATTEMPTS: "4"
          TESTFLIGHT_UPLOAD_RETRY_BASE_SECONDS: "20"
        run: |
          set -euo pipefail
          bun run scripts/upload-ios-testflight.ts "${{ steps.ipa.outputs.path }}"
      - name: Upload iOS artifact to release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ github.ref_name }}
          files: ${{ steps.ipa.outputs.path }}
          draft: true
          prerelease: ${{ contains(github.ref, 'alpha') || contains(github.ref, 'beta') || contains(github.ref, 'rc') }}

  # ── Create GitHub Release with CLI binaries + checksums ─────────────────────
  release:
    name: Create Release
    needs: [build-cli, smoke-cli-darwin-x64, build-mobile]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Determine tag name
        id: tag
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "name=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            git fetch --tags
            TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
            echo "name=$TAG" >> "$GITHUB_OUTPUT"
          fi
      - name: Download release artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts
      - name: Flatten artifacts and generate checksums
        env:
          TAG: ${{ steps.tag.outputs.name }}
        run: |
          set -euo pipefail
          mkdir -p release-assets
          find artifacts -type f -exec cp {} release-assets/ \;
          cd release-assets
          # Label CLI binaries clearly: cybara-v<version>-<target>-cli[.exe]
          VERSION="${TAG#v}"
          for f in cybara-linux-x64 cybara-linux-arm64 cybara-darwin-x64 cybara-darwin-arm64; do
            [ -f "$f" ] && mv "$f" "cybara-v${VERSION}-${f#cybara-}-cli"
          done
          for f in cybara-windows-x64.exe cybara-windows-arm64.exe; do
            stem="${f#cybara-}"
            [ -f "$f" ] && mv "$f" "cybara-v${VERSION}-${stem%.exe}-cli.exe"
          done
          echo "Bundled assets:"
          ls -1
          : > checksums.txt
          for asset in *; do
            [ "$asset" = "checksums.txt" ] && continue
            digest="$(sha256sum "$asset" | awk '{print $1}')"
            printf '%s  %s\n' "$digest" "$asset" >> checksums.txt
            printf '%s  %s\n' "$digest" "$asset" > "${asset}.sha256"
          done
          echo "Checksums:"
          cat checksums.txt
      - name: Create or Update Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          files: release-assets/*
          generate_release_notes: true
          draft: true
          prerelease: ${{ contains(github.ref, 'alpha') || contains(github.ref, 'beta') || contains(github.ref, 'rc') }}

  publish-release:
    name: Publish Release
    needs: [release, build-tauri, build-native-macos, build-android, build-ios]
    runs-on: ubuntu-latest
    if: ${{ always() && needs.release.result == 'success' }}
    permissions:
      contents: write
      actions: write
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Determine tag name
        id: tag
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "name=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            git fetch --tags
            TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
            echo "name=$TAG" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish canonical updater manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.name }}
        run: |
          set -euo pipefail
          test -n "$TAG"
          bun run scripts/publish-tauri-updater-manifest.ts "$TAG" release-check/latest.json
      - name: Download updater manifest from draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.name }}
        run: |
          set -euo pipefail
          test -n "$TAG"
          mkdir -p release-check
          gh release download "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern latest.json \
            --dir release-check \
            --clobber
      - name: Verify updater manifest is complete
        env:
          CYBARA_TAURI_REQUIRED_UPDATER_PLATFORMS: darwin-aarch64,darwin-aarch64-app,darwin-x86_64,darwin-x86_64-app,linux-x86_64,linux-x86_64-deb,linux-x86_64-rpm,windows-x86_64,windows-x86_64-msi,windows-x86_64-nsis
        run: bun run scripts/verify-tauri-updater-manifest.ts release-check/latest.json
      - name: Sync Nix release hashes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.name }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          CHECKSUM_DIR="$RUNNER_TEMP/cybara-nix-checksums"
          rm -rf "$CHECKSUM_DIR"
          mkdir -p "$CHECKSUM_DIR"
          for TARGET in linux-x64 linux-arm64 darwin-x64 darwin-arm64; do
            gh release download "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --pattern "cybara-v${VERSION}-${TARGET}-cli.sha256" \
              --dir "$CHECKSUM_DIR"
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for ATTEMPT in 1 2 3; do
            git fetch origin main
            git checkout -B nix-release-sync origin/main
            bun run scripts/sync-nix-release.ts "$VERSION" "$CHECKSUM_DIR"
            if git diff --quiet -- nix/release.nix; then
              echo "No Nix hash changes for ${VERSION}."
              exit 0
            fi
            git add nix/release.nix
            git commit -m "nix: sync release hashes for v${VERSION} [skip ci]"
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep "$ATTEMPT"
          done
          echo "Could not synchronize Nix release hashes after 3 attempts." >&2
          exit 1
      - name: Publish draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.name }}
        run: |
          set -euo pipefail
          test -n "$TAG"
          if [[ "$GITHUB_REF" == *alpha* || "$GITHUB_REF" == *beta* || "$GITHUB_REF" == *rc* ]]; then
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease
          else
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
          fi
      - name: Trigger package publishing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.name }}
        run: |
          set -euo pipefail
          test -n "$TAG"
          gh workflow run publish-packages.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f version="${TAG#v}"
