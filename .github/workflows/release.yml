name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  BUN_VERSION: "1.3.14"
  PUPPETEER_SKIP_DOWNLOAD: "true"
  SKIP_SPAWN_TESTS: "1"
  # On a tagged release the ref name IS the version (e.g. v1.0.476). version:sync
  # strips the leading "v" and uses it verbatim, so the shallow CI checkout can't
  # miscompute the version from the commit count. Branch dispatches (ref_name not
  # a semver) fall back to the commit-count computation.
  CYBARA_RELEASE_VERSION: ${{ github.ref_name }}

jobs:
  # ── Quality gate ────────────────────────────────────────────────────────────
  quality:
    name: CI Quality Gate
    runs-on: [self-hosted, Linux, X64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install root dependencies
        run: bun install --ignore-scripts && bun run scripts/postinstall.ts
      - name: Install UI dependencies
        run: cd ui && bun install
      - name: Run CI checks
        run: bun run check:ci
      - name: Security audit
        run: bun audit || true

  # ── CLI binaries (cross-compiled from self-hosted) ──────────────────────────
  build-cli:
    name: CLI ${{ matrix.target }}
    needs: quality
    runs-on: [self-hosted, Linux, X64]
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            artifact: cybara-linux-x64
          - target: linux-arm64
            artifact: cybara-linux-arm64
          - target: darwin-x64
            artifact: cybara-darwin-x64
          - target: darwin-arm64
            artifact: cybara-darwin-arm64
          - target: windows-x64
            artifact: cybara-windows-x64.exe
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install dependencies
        run: bun install --ignore-scripts && bun run scripts/postinstall.ts
      - name: Sync version metadata
        run: bun run version:sync
      - name: Type check
        run: bun run typecheck
      - name: Build UI
        run: cd ui && bun install && bun run build
      - name: Build TypeScript
        run: bun run build
      - name: Cross-compile CLI binary
        run: |
          bun build src/index.ts --compile --target=bun-${{ matrix.target }} --outfile=${{ matrix.artifact }} --external electron --external @aws-sdk/client-s3 --external onnxruntime-node --external onnxruntime-web --external @huggingface/transformers
      - name: Upload CLI artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}
          retention-days: 30

  # ── Tauri desktop apps (platform-native builds) ────────────────────────────
  build-tauri:
    name: Tauri ${{ matrix.rust_target }}
    needs: quality
    # Tauri builds are best-effort — they don't block the CLI release.
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS arm64 — native build on the self-hosted Apple Silicon mac (Meta-Mini)
          - platform: macos
            runner: [self-hosted, macOS, ARM64]
            args: "--target aarch64-apple-darwin"
            rust_target: aarch64-apple-darwin
            bun_target: bun-darwin-arm64
            sidecar: "src-tauri/bin/cybara-aarch64-apple-darwin"
          # macOS x64 — cross-compiled on the same Apple Silicon mac
          - platform: macos
            runner: [self-hosted, macOS, ARM64]
            args: "--target x86_64-apple-darwin"
            rust_target: x86_64-apple-darwin
            bun_target: bun-darwin-x64
            sidecar: "src-tauri/bin/cybara-x86_64-apple-darwin"
          # Windows x64 — self-hosted Windows runner (AI370)
          - platform: windows
            runner: [self-hosted, Windows, X64]
            args: ""
            rust_target: x86_64-pc-windows-msvc
            bun_target: bun-windows-x64
            sidecar: "src-tauri/bin/cybara-x86_64-pc-windows-msvc.exe"
          # Linux x64 — self-hosted Linux runner (get32)
          - platform: self-hosted
            runner: [self-hosted, Linux, X64]
            args: ""
            rust_target: x86_64-unknown-linux-gnu
            bun_target: bun-linux-x64
            sidecar: "src-tauri/bin/cybara-x86_64-unknown-linux-gnu"

    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install Rust stable (non-Windows)
        if: matrix.platform != 'windows'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}
      # dtolnay/rust-toolchain runs its setup via `shell: bash`, which on the
      # self-hosted Windows runner resolves to WSL's bash (System32\bash.exe)
      # and mangles Windows paths ("No such file or directory"). Install via
      # rustup in the native (PowerShell) shell instead. (Permanent fix: remove
      # WSL bash from the runner so `shell: bash` uses git-bash.)
      - name: Install Rust stable (Windows)
        if: matrix.platform == 'windows'
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          rustup target add ${{ matrix.rust_target }}
      - name: Install Linux dependencies
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      # Split into two steps (no '&&') so it runs under each OS's native shell
      # — bash on Linux/macOS, PowerShell on the self-hosted Windows runner —
      # without relying on a 'bash' shell that resolves to WSL on Windows.
      - name: Install dependencies
        run: bun install --ignore-scripts
      - name: Run postinstall
        run: bun run scripts/postinstall.ts
      - name: Sync version metadata
        run: bun run version:sync
      - name: Build UI
        run: bun run ui:build
      - name: Build Sidecar binary
        env:
          CYBARA_SIDECAR_BUN_TARGET: ${{ matrix.bun_target }}
        run: bun run scripts/build-sidecar.ts
      - name: Prepare updater config
        env:
          CYBARA_TAURI_UPDATER_PUBKEY: ${{ secrets.TAURI_SIGNING_PUBLIC_KEY }}
          CYBARA_RELEASE_REPOSITORY: ${{ github.repository }}
        run: bun run tauri:prepare-release
      - name: Build Tauri App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          NO_STRIP: "true"
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Cybara ${{ github.ref_name }}"
          releaseBody: "Download the appropriate installer for your platform below."
          releaseDraft: false
          args: ${{ matrix.args }} --config src-tauri/tauri.release.conf.json

  # ── Native macOS app (SwiftUI shell) — signed + notarized ───────────────────
  build-native-macos:
    name: Native macOS ${{ matrix.arch }}
    needs: quality
    # Best-effort: the native app doesn't block the CLI release.
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: [self-hosted, macOS, ARM64]
    runs-on: ${{ matrix.runner }}
    env:
      # Mapped from secrets so steps can gate on presence. Leave the secrets
      # unset to produce an unsigned (Gatekeeper-quarantined) build instead.
      MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      MACOS_KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
      MACOS_NOTARY_API_KEY: ${{ secrets.MACOS_NOTARY_API_KEY }}
      MACOS_NOTARY_API_KEY_ID: ${{ secrets.MACOS_NOTARY_API_KEY_ID }}
      MACOS_NOTARY_API_ISSUER_ID: ${{ secrets.MACOS_NOTARY_API_ISSUER_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install dependencies
        run: bun install --ignore-scripts
      - name: Run postinstall
        run: bun run scripts/postinstall.ts
      - name: Sync version metadata
        run: bun run version:sync
      - name: Run native-app unit tests
        run: |
          DEV_DIR=$(xcode-select -p 2>/dev/null || echo "")
          if echo "$DEV_DIR" | grep -qi "Xcode.app"; then
            swift test --package-path apps/macos/Cybara
          else
            echo "::warning::Full Xcode not selected ($DEV_DIR); XCTest unavailable, skipping native unit tests"
          fi
      - name: Import signing certificate
        if: env.MACOS_CERTIFICATE != ''
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/cybara-signing.keychain-db"
          KC_PW="${MACOS_KEYCHAIN_PASSWORD:-cybara-ci}"
          security create-keychain -p "$KC_PW" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KC_PW" "$KEYCHAIN"
          echo "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" \
            -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KC_PW" "$KEYCHAIN" >/dev/null
          # Prepend the temp keychain to the search list so codesign can find it.
          security list-keychains -d user -s "$KEYCHAIN" \
            $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/cert.p12"
      - name: Store notarization credentials
        if: env.MACOS_NOTARY_API_KEY != ''
        run: |
          set -euo pipefail
          echo "$MACOS_NOTARY_API_KEY" | base64 --decode > "$RUNNER_TEMP/notary.p8"
          xcrun notarytool store-credentials cybara-notary \
            --key "$RUNNER_TEMP/notary.p8" \
            --key-id "$MACOS_NOTARY_API_KEY_ID" \
            --issuer "$MACOS_NOTARY_API_ISSUER_ID"
          rm -f "$RUNNER_TEMP/notary.p8"
      - name: Package native macOS app
        env:
          # The packaging script signs only when the identity is set, and
          # notarizes only when the profile is set (requires the identity too).
          CYBARA_MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          CYBARA_MACOS_NOTARY_KEYCHAIN_PROFILE: ${{ secrets.MACOS_NOTARY_API_KEY != '' && 'cybara-notary' || '' }}
        run: bun run scripts/package-native-macos.ts
      - name: Clean up signing keychain
        if: always() && env.MACOS_CERTIFICATE != ''
        run: security delete-keychain "$RUNNER_TEMP/cybara-signing.keychain-db" || true
      - name: Upload native macOS artifact to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            release/native-macos/${{ matrix.arch }}/*.zip
            release/native-macos/${{ matrix.arch }}/*.sha256
          draft: false
          prerelease: ${{ contains(github.ref, 'alpha') || contains(github.ref, 'beta') || contains(github.ref, 'rc') }}

  # ── React Native mobile app (Expo update bundles) ──────────────────────────
  build-mobile:
    name: Mobile Expo bundles
    needs: quality
    runs-on: [self-hosted, Linux, X64]
    env:
      EXPO_NO_TELEMETRY: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install dependencies
        run: bun install --ignore-scripts
      - name: Run postinstall
        run: bun run scripts/postinstall.ts
      - name: Sync version metadata
        run: bun run version:sync
      - name: Check Expo dependency compatibility
        run: bun run mobile:expo-check
      - name: Type check mobile app
        run: bun run mobile:typecheck
      - name: Export iOS and Android bundles
        run: |
          set -euo pipefail
          rm -rf release/mobile/expo
          mkdir -p release/mobile/expo
          cd apps/mobile
          bunx expo export --platform ios --output-dir ../../release/mobile/expo/ios
          bunx expo export --platform android --output-dir ../../release/mobile/expo/android
      - name: Package mobile release artifact
        run: |
          set -euo pipefail
          MOBILE_REF="${GITHUB_REF_NAME:-${GITHUB_SHA}}"
          MOBILE_REF="${MOBILE_REF//\//-}"
          cp apps/mobile/app.json release/mobile/expo/app.json
          cp apps/mobile/package.json release/mobile/expo/package.json
          tar -czf "release/mobile/cybara-mobile-expo-${MOBILE_REF}.tar.gz" -C release/mobile expo
      - name: Upload mobile artifact
        uses: actions/upload-artifact@v4
        with:
          name: cybara-mobile-expo
          path: release/mobile/*.tar.gz
          retention-days: 30

  # ── Android APK (local Gradle build via Expo prebuild) ─────────────────────
  build-android:
    name: Android APK
    needs: quality
    continue-on-error: true
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: [self-hosted, Linux, X64]
    env:
      CYBARA_RELEASE_VERSION: ${{ github.ref_name }}
      EXPO_NO_TELEMETRY: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Install dependencies
        run: bun install --ignore-scripts && bun run scripts/postinstall.ts
      - name: Sync version metadata
        run: bun run version:sync
      - name: Prebuild Android project
        run: cd apps/mobile && bunx expo prebuild --platform android --no-install
      # Debug build is debug-signed and therefore installable without a keystore.
      # If ANDROID_KEYSTORE_BASE64 (+ ANDROID_KEY_* ) secrets are added later,
      # switch this to assembleRelease with a signing config.
      - name: Build APK
        run: cd apps/mobile/android && ./gradlew assembleDebug --no-daemon -x lint
      - name: Name APK
        id: apk
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          SRC="$(find apps/mobile/android/app/build/outputs/apk -name '*.apk' | head -1)"
          OUT="cybara-v${VERSION}-android.apk"
          cp "$SRC" "$OUT"
          echo "path=$OUT" >> "$GITHUB_OUTPUT"
      - name: Upload APK to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: ${{ steps.apk.outputs.path }}

  # ── iOS build (local Xcode build via Expo prebuild) ────────────────────────
  # Produces a signed .ipa only when Apple signing secrets are configured;
  # otherwise best-effort archives for inspection. Requires a macOS runner.
  build-ios:
    name: iOS build
    needs: quality
    continue-on-error: true
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: [self-hosted, macOS, ARM64]
    env:
      CYBARA_RELEASE_VERSION: ${{ github.ref_name }}
      EXPO_NO_TELEMETRY: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install dependencies
        run: bun install --ignore-scripts && bun run scripts/postinstall.ts
      - name: Sync version metadata
        run: bun run version:sync
      - name: Prebuild iOS project
        run: cd apps/mobile && bunx expo prebuild --platform ios --no-install
      - name: Build unsigned archive
        run: |
          set -euo pipefail
          cd apps/mobile/ios
          SCHEME="$(xcodebuild -list -json | bun -e 'const d=await Bun.stdin.json();console.log(d.project.schemes[0])')"
          xcodebuild -workspace *.xcworkspace -scheme "$SCHEME" -configuration Release \
            -sdk iphoneos -archivePath build/Cybara.xcarchive \
            CODE_SIGNING_ALLOWED=NO archive
      - name: Package .ipa
        id: ipa
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          APP="$(find apps/mobile/ios/build/Cybara.xcarchive/Products/Applications -maxdepth 1 -name '*.app' | head -1)"
          mkdir -p Payload && cp -R "$APP" Payload/
          OUT="cybara-v${VERSION}-ios.ipa"
          zip -qr "$OUT" Payload
          echo "path=$OUT" >> "$GITHUB_OUTPUT"
      - name: Upload iOS artifact to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: ${{ steps.ipa.outputs.path }}

  # ── Create GitHub Release with CLI binaries + checksums ─────────────────────
  release:
    name: Create Release
    needs: [build-cli, build-mobile]
    runs-on: [self-hosted, Linux, X64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Determine tag name
        id: tag
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "name=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            git fetch --tags
            TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
            echo "name=$TAG" >> "$GITHUB_OUTPUT"
          fi
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Flatten artifacts and generate checksums
        env:
          TAG: ${{ steps.tag.outputs.name }}
        run: |
          set -euo pipefail
          mkdir -p release-assets
          find artifacts -type f -exec cp {} release-assets/ \;
          cd release-assets
          # Label CLI binaries clearly: cybara-v<version>-<target>-cli[.exe]
          VERSION="${TAG#v}"
          for f in cybara-linux-x64 cybara-linux-arm64 cybara-darwin-x64 cybara-darwin-arm64; do
            [ -f "$f" ] && mv "$f" "cybara-v${VERSION}-${f#cybara-}-cli"
          done
          [ -f cybara-windows-x64.exe ] && mv cybara-windows-x64.exe "cybara-v${VERSION}-windows-x64-cli.exe"
          echo "Bundled assets:"
          ls -1
          : > checksums.txt
          for asset in *; do
            [ "$asset" = "checksums.txt" ] && continue
            digest="$(sha256sum "$asset" | awk '{print $1}')"
            printf '%s  %s\n' "$digest" "$asset" >> checksums.txt
            printf '%s  %s\n' "$digest" "$asset" > "${asset}.sha256"
          done
          echo "Checksums:"
          cat checksums.txt
      - name: Create or Update Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          files: release-assets/*
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref, 'alpha') || contains(github.ref, 'beta') || contains(github.ref, 'rc') }}
