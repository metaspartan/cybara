name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  BUN_VERSION: '1.3.14'
  PUPPETEER_SKIP_DOWNLOAD: 'true'
  SKIP_SPAWN_TESTS: '1'

jobs:
  quality:
    name: CI Quality Gate
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install root dependencies
        run: bun install --ignore-scripts && bun run scripts/postinstall.ts

      - name: Install UI dependencies
        run: cd ui && bun install

      - name: Run CI checks
        run: bun run check:ci

      - name: Security audit
        run: bun audit || true

  build:
    name: Build ${{ matrix.target }}
    needs: quality
    runs-on: self-hosted
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            artifact: cybara-linux-x64
          - target: linux-arm64
            artifact: cybara-linux-arm64
          - target: darwin-x64
            artifact: cybara-darwin-x64
          - target: darwin-arm64
            artifact: cybara-darwin-arm64
          - target: windows-x64
            artifact: cybara-windows-x64.exe

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --ignore-scripts && bun run scripts/postinstall.ts

      - name: Sync version metadata
        run: bun run version:sync

      - name: Type check
        run: bun run typecheck

      - name: Build UI
        run: cd ui && bun install && bun run build

      - name: Build TypeScript
        run: bun run build

      - name: Cross-compile binary
        run: |
          bun build src/index.ts --compile --target=bun-${{ matrix.target }} --outfile=${{ matrix.artifact }} --external electron

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}
          retention-days: 30

  release:
    name: Create Release
    needs: build
    runs-on: self-hosted
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten artifacts and generate checksums
        run: |
          set -euo pipefail
          mkdir -p release-assets
          find artifacts -type f -exec cp {} release-assets/ \;
          cd release-assets
          echo "Bundled assets:"
          ls -1
          : > checksums.txt
          for asset in *; do
            [ "$asset" = "checksums.txt" ] && continue
            digest="$(sha256sum "$asset" | awk '{print $1}')"
            printf '%s  %s\n' "$digest" "$asset" >> checksums.txt
            printf '%s  %s\n' "$digest" "$asset" > "${asset}.sha256"
          done
          echo "Checksums:"
          cat checksums.txt

      - name: Determine tag name
        id: tag
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "name=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            git fetch --tags
            TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
            echo "name=$TAG" >> "$GITHUB_OUTPUT"
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          files: |
            release-assets/*
            release-assets/*.sha256
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref, 'alpha') || contains(github.ref, 'beta') || contains(github.ref, 'rc') }}
