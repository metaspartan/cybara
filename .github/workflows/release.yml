name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      skip_tests:
        description: 'Skip tests before building (tag builds always run checks)'
        type: boolean
        default: false

permissions:
  contents: write

# Pin Bun for reproducible release binaries across runs.
env:
  BUN_VERSION: '1.3.14'

jobs:
  # Quality gate: never release a broken build. Tag-triggered builds always run
  # the full CI suite; the skip_tests escape hatch only applies to manual dispatch.
  quality:
    name: CI Quality Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install root dependencies
        run: bun install

      - name: Install UI dependencies
        run: cd ui && bun install

      - name: Run CI checks
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.skip_tests }}
        run: bun run check:ci

  build:
    name: Build ${{ matrix.target }}
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            os: ubuntu-latest
            artifact: cybara-linux-x64
          - target: linux-arm64
            os: ubuntu-latest
            artifact: cybara-linux-arm64
          - target: darwin-x64
            os: macos-latest
            artifact: cybara-darwin-x64
          - target: darwin-arm64
            os: macos-latest
            artifact: cybara-darwin-arm64
          - target: windows-x64
            os: windows-latest
            artifact: cybara-windows-x64.exe
          # windows-arm64 removed: Bun doesn't ship a pre-built aarch64 Windows
          # executable for cross-compilation yet. Re-add when supported.
          # - target: windows-arm64
          #   os: windows-latest
          #   artifact: cybara-windows-arm64.exe

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install

      - name: Sync version metadata
        run: bun run version:sync

      - name: Type check
        run: bun run typecheck

      - name: Build UI
        run: cd ui && bun install && bun run build

      - name: Build TypeScript
        run: bun run build

      - name: Compile binary
        run: |
          bun build src/index.ts --compile --target=bun-${{ matrix.target }} --outfile=${{ matrix.artifact }} --external electron

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}
          retention-days: 30

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    # Run on both tag pushes AND workflow_dispatch (triggered by main-version-tag.yml)
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten artifacts and generate checksums
        run: |
          set -euo pipefail
          mkdir -p release-assets
          # Move every artifact to a single flat directory.
          find artifacts -type f -exec cp {} release-assets/ \;
          cd release-assets
          echo "Bundled assets:"
          ls -1
          # Generate per-asset SHA256 sidecars and a combined checksums file.
          : > checksums.txt
          for asset in *; do
            [ "$asset" = "checksums.txt" ] && continue
            digest="$(sha256sum "$asset" | awk '{print $1}')"
            printf '%s  %s\n' "$digest" "$asset" >> checksums.txt
            printf '%s  %s\n' "$digest" "$asset" > "${asset}.sha256"
          done
          echo "Checksums:"
          cat checksums.txt

      - name: Determine tag name
        id: tag
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "name=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            # workflow_dispatch: find the latest tag
            TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
            if [ -z "$TAG" ]; then
              # Fetch tags if needed
              git fetch --tags
              TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
            fi
            echo "name=$TAG" >> "$GITHUB_OUTPUT"
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          files: |
            release-assets/*
            release-assets/*.sha256
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref, 'alpha') || contains(github.ref, 'beta') || contains(github.ref, 'rc') }}
