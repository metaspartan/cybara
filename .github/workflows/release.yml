name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      skip_tests:
        description: 'Skip tests before building'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            os: ubuntu-latest
            artifact: cybara-linux-x64
          - target: linux-arm64
            os: ubuntu-latest
            artifact: cybara-linux-arm64
          - target: darwin-x64
            os: macos-latest
            artifact: cybara-darwin-x64
          - target: darwin-arm64
            os: macos-latest
            artifact: cybara-darwin-arm64
          - target: windows-x64
            os: windows-latest
            artifact: cybara-windows-x64.exe
          - target: windows-arm64
            os: windows-latest
            artifact: cybara-windows-arm64.exe
    
    runs-on: ${{ matrix.os }}
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Sync version metadata
        run: bun run version:sync

      - name: Type check
        if: ${{ !inputs.skip_tests }}
        run: bun run typecheck

      - name: Build UI
        run: cd ui && bun install && bun run build

      - name: Build TypeScript
        run: bun run build

      - name: Compile binary
        run: |
          bun build src/main.ts --compile --target=bun-${{ matrix.target }} --outfile=${{ matrix.artifact }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}
          retention-days: 30

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: find artifacts -type f

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref, 'alpha') || contains(github.ref, 'beta') || contains(github.ref, 'rc') }}
